<script>
const DATA = {"cards": [["Que signifie « nation » dans le cours ?", "Le peuple qui a conscience d'être uni par une histoire, une langue et une culture commune.", "Introduction"], ["Qu'est-ce qu'une révolution ?", "Un bouleversement brusque et par la force d'un ordre social et politique.", "Introduction"], ["Quand Louis XVI convoque-t-il les États généraux ?", "Le 5 mai 1789. Ils n'avaient plus été réunis depuis 1614.", "Naissance d'une France nouvelle"], ["Quels sont les trois ordres et leurs proportions dans le cours ?", "Clergé : 1 % ; noblesse : 2 % ; tiers état : 97 %.", "États généraux"], ["Que sont les cahiers de doléances ?", "Des documents regroupant les plaintes, demandes et propositions de la population.", "États généraux"], ["Quelle différence entre vote par ordre et vote par tête ?", "Par ordre : un vote par ordre. Par tête : chaque député dispose d'une voix.", "États généraux"], ["Que se passe-t-il le 17 juin 1789 ?", "Naissance de l'Assemblée nationale : les députés du tiers état affirment représenter la nation.", "Assemblée nationale"], ["Que promettent les députés le 20 juin 1789 ?", "Lors du serment du Jeu de paume, ils jurent de ne pas se séparer avant d'avoir donné une Constitution à la France.", "Jeu de paume"], ["Que symbolise la prise de la Bastille du 14 juillet 1789 ?", "Le peuple intervient directement dans la vie politique ; la Bastille symbolise l'arbitraire royal.", "Révolution populaire"], ["Que se passe-t-il dans la nuit du 4 août 1789 ?", "Les députés votent l'abolition des privilèges féodaux, des droits seigneuriaux et de nombreux avantages.", "Abolition des privilèges"], ["Quand la DDHC est-elle adoptée ?", "Le 26 août 1789.", "DDHC"], ["Quels sont les droits naturels cités à l'article 2 de la DDHC ?", "La liberté, la propriété, la sûreté et la résistance à l'oppression.", "DDHC"], ["Que disent les articles 3 et 14 de la DDHC ?", "La souveraineté appartient à la nation ; les citoyens participent à la formation des lois et au consentement à l'impôt.", "DDHC"], ["Que garantissent les articles 7, 8 et 9 de la DDHC ?", "Pas d'arrestation ou détention arbitraire ; peines prévues par la loi ; présomption d'innocence.", "DDHC"], ["Que garantissent les articles 10 et 11 de la DDHC ?", "Liberté d'opinion, notamment religieuse, et liberté d'expression et de communication.", "DDHC"], ["Que se passe-t-il les 5 et 6 octobre 1789 ?", "La marche des femmes de Paris à Versailles réclame du pain, la signature des décrets et le retour du roi à Paris.", "Fin de l'absolutisme"], ["Que célèbre la fête de la Fédération du 14 juillet 1790 ?", "L'unité ; elle commémore la prise de la Bastille et Louis XVI prête serment à la nation et à la loi.", "Fête de la Fédération"], ["Que met en place la Constitution du 13 septembre 1791 ?", "Une monarchie constitutionnelle : la nation est souveraine ; le roi conserve le pouvoir exécutif et l'Assemblée le pouvoir législatif.", "Constitution de 1791"], ["Qu'est-ce que le suffrage censitaire ?", "Le droit de vote est accordé sous condition de payer un impôt, le cens.", "Constitution de 1791"], ["Que crée la Constitution civile du clergé du 12 juillet 1790 ?", "Le clergé est salarié par l'État ; évêques, curés et prêtres sont élus et doivent prêter serment.", "Église et Révolution"], ["Que se passe-t-il à Varennes le 21 juin 1791 ?", "Louis XVI fuit Paris, est reconnu à Varennes et ramené de force à Paris ; la confiance entre le roi et le peuple est rompue.", "Échec de la monarchie"], ["Quand la France déclare-t-elle la guerre à l'Autriche ?", "En avril 1792.", "Guerre et chute de la monarchie"], ["Que se passe-t-il le 10 août 1792 ?", "Les sans-culottes et fédérés attaquent les Tuileries ; le roi est arrêté et la monarchie suspendue.", "Chute de la monarchie"], ["Quelles sont les dates de Valmy, de l'abolition de la monarchie et de la proclamation de la République ?", "Valmy : 20 septembre 1792 ; abolition de la monarchie : 21 septembre 1792 ; proclamation de la République : 22 septembre 1792.", "Première République"], ["Quels sont les trois groupes de la Convention ?", "Les Montagnards, les Girondins et la Plaine (ou le Marais).", "Convention"], ["Quand Louis XVI est-il guillotiné ?", "Le 21 janvier 1793.", "Première République"], ["Quels sont les trois dangers auxquels la République fait face ?", "La guerre contre les monarchies européennes ; la révolte vendéenne ; les insurrections des Fédérés.", "Patrie en danger"], ["Quand le Comité de salut public est-il créé ?", "Le 6 avril 1793 ; il compte 12 membres.", "Terreur"], ["À quoi sert la loi des maximums ?", "Adoptée en mai 1793, elle fixe des prix maximums pour certaines denrées afin de lutter contre la hausse des prix.", "Terreur"], ["À quoi sert la loi des suspects ?", "En septembre 1793, elle permet d'arrêter les personnes considérées comme ennemies de la République ou soupçonnées de s'opposer à la Révolution.", "Terreur"], ["Quand la levée en masse est-elle décidée et pourquoi ?", "Le 23 août 1793, pour recruter massivement des soldats et défendre la République contre les armées étrangères.", "Terreur"], ["Quand Danton est-il guillotiné ?", "Le 5 avril 1794.", "Terreur"], ["Que se passe-t-il les 27 et 28 juillet 1794 ?", "Robespierre est arrêté le 27 juillet (9 thermidor An II) et guillotiné le 28 juillet (10 thermidor An II).", "Fin de la Terreur"], ["Quand le Directoire est-il instauré ?", "En août 1795, par la Constitution de l'an III.", "Directoire"], ["Quand Napoléon réalise-t-il son coup d'État ?", "Le 9 novembre 1799, 18 Brumaire an VIII ; il met fin au Directoire et instaure le Consulat.", "Consulat"], ["Que devient Napoléon en 1802 puis en 1804 ?", "En 1802, il se proclame Consul à vie ; en 1804, il se nomme Empereur et est sacré le 2 décembre.", "Empire"], ["Qu'est-ce qu'un plébiscite ?", "Un référendum.", "Consulat et Empire"], ["Qu'est-ce qu'un concordat ?", "Un traité entre le pape et un État qui définit les relations entre l'Église et cet État.", "Pacification"], ["Quand Napoléon signe-t-il le Concordat avec Pie VII ?", "En 1801.", "Pacification"], ["Que sont les « masses de granit » ?", "Les grandes institutions civiles créées par Napoléon.", "Modernisation de l'État"], ["Quand le Code civil est-il promulgué ?", "Le 21 mars 1804 ; il rassemble les lois fixant les bases des relations sociales entre les individus.", "Code civil"], ["Quelles sont les grandes batailles napoléoniennes citées en 1805, 1806 et 1809 ?", "Trafalgar (défaite française face aux Anglais) en octobre 1805 ; Austerlitz (victoire contre l'Autriche) en décembre 1805 ; Iéna (victoire contre la Prusse) en 1806 ; Wagram (victoire contre l'Autriche) en 1809.", "Conquêtes"], ["Que se passe-t-il à Madrid les 2 et 3 mai 1808 ?", "Le 2 mai, les habitants se soulèvent contre l'occupation française ; le 3 mai, Napoléon ordonne une répression sévère.", "Nations contre la France"], ["Pourquoi la campagne de Russie de 1812 marque-t-elle un tournant ?", "La Grande Armée est décimée par le froid, la faim et les difficultés du retrait ; cela marque le début du déclin de Napoléon.", "Déclin"], ["Quand Napoléon abdique-t-il et où est-il exilé ?", "En avril 1814 ; il est exilé sur l'île d'Elbe.", "Déclin"], ["Que sont les Cent-Jours ?", "La période qui commence lorsque Napoléon s'échappe de l'île d'Elbe et reprend le pouvoir en mars 1815.", "Déclin"], ["Quand a lieu Waterloo et quelle en est la conséquence ?", "Le 18 juin 1815 ; la défaite met officiellement fin à l'Empire napoléonien.", "Déclin"], ["Quand se déroule le Congrès de Vienne et quel est son objectif ?", "De septembre 1814 à juin 1815 ; réorganiser l'Europe, redessiner les frontières, restaurer des monarchies et maintenir l'équilibre entre puissances.", "Congrès de Vienne"], ["Quelles sont les principales libertés supprimées par Napoléon selon le cours ?", "La liberté d'opinion politique et la liberté d'expression ; il rétablit la censure de la presse et surveille la population.", "Régime autoritaire"], ["Quel est le rôle du préfet sous Napoléon ?", "Il représente le pouvoir central dans chaque département.", "Modernisation de l'État"], ["Quelle limite du Code civil concerne les femmes dans le cours ?", "Malgré l'égalité devant la loi, les lois n'égalisent pas les citoyens : le mari et la femme sont inégaux sur le divorce et elle lui doit obéissance.", "Code civil"]], "chunks": [{"title": "Partie 1 · cours intégral", "content": "Thème 1 : L'Europe face aux révolutions\n\nChapitre 1 : La Révolution française et l'Empire : une\nnouvelle conception de la nation\n\nIntroduction :\nLa nation est le peuple qui a conscience d'être uni par une histoire, une langue\net une culture commune. De plus, le concept de révolution implique l'idée d'un\nbouleversement brusque et par la force d'un ordre social et politique. À la veille\nde la révolution, la nation française, au sens moderne du terme, n'existe pas\nvraiment. C'est une monarchie absolue à laquelle les sujets doivent soumission\net obéissance et la société d'ordre est très inégalitaire. La période\nrévolutionnaire (1789-1815) ouvre un temps de bouleversement majeur\npolitiquement et socialement et fait émerger le concept fondamental de la\nnation en France. De plus, une crise économique et sociale fait gronder le\npeuple. En effet, le peuple de Paris est misérable et meurt de faim. Cette crise\nsociale alimente une forte dynamique politique. Parallèlement, la monarchie\nfrançaise connaît une grave crise financière. C'est dans ce contexte que Louis\nXVI cherche des solutions et convoque les États généraux le 5 mai 1789.\n\nI. La naissance d'une France nouvelle (1789-1790)\n\nA. La convocation des États généraux\nLe roi convoque les États généraux pour le 5 mai 1789. Ils n'avaient plus été\nréunis depuis 1614.\n\nLes États généraux réunissent les trois ordres de la société :\n\n●​ le clergé (1%) ;\n   ●​ la noblesse (2%) ;\n   ●​ le tiers état, qui représente l'immense majorité de la population (97%).\n\nChaque ordre rédige des cahiers de doléances, qui regroupent les plaintes,\ndemandes et propositions de la population.\n\fLe tiers état obtient deux fois plus de députés que chacun des deux autres\nordres, soit environ 600 députés sur 1200. Cependant, la question du mode de\nvote pose problème : le vote traditionnel se fait par ordre, ce qui donne un vote\nà chaque ordre, tandis que le tiers état réclame un vote par tête, où chaque\ndéputé dispose d'une voix.\n\nLe 5 mai 1789, les 1139 députés arrivent à Versailles. Louis XVI ouvre les États\ngénéraux par un discours de 4 minutes. Il passe ensuite la parole au ministre\ndes finances Jacques Necker. Celui-ci insiste principalement sur les difficultés\nfinancières du royaume et la nécessité de rétablir les finances.\n\nCette ouverture déçoit une partie des députés, notamment ceux du tiers état,\nqui espéraient des réformes politiques (vote par tête) et sociales plus\nimportantes.\n\nB. La fin de la monarchie absolue et de la société d'ordres :\nl'émergence d'une nouvelle définition de la nation"}, {"title": "Partie 2 · cours intégral", "content": "1. Le rôle fondateur de la naissance de l'Assemblée Nationale et du\nserment du Jeu de paume\nEn juin 1789, les députés du tiers état prennent des initiatives décisives qui\nremettent en cause l'autorité de la monarchie absolue.\n\n17 juin 1789 : la naissance de l'Assemblée nationale\nIls affirment ainsi représenter la nation et non plus seulement leur ordre.\n\nCette décision constitue une rupture avec le fonctionnement traditionnel des\nÉtats généraux : les députés souhaitent désormais participer directement à la\nrédaction des lois et à l'organisation politique du royaume.\n\n20 juin 1789 : le Serment du Jeu de paume\nLe 20 juin 1789, les députés trouvent leur salle de réunion (salle des\nMenus-Plaisirs, à Versailles) fermée sur ordre du roi. Ils se réunissent alors\ndans la salle du Jeu de paume, à Versailles.\n\nIls prêtent le serment du Jeu de paume : ils jurent de ne pas se séparer avant\nd'avoir donné une Constitution à la France.\n\fCet événement marque la volonté de mettre fin à la monarchie absolue et\nd'établir une monarchie constitutionnelle.\n\n23 juin 1789 : le refus d'obéir au roi\nLe 23 juin 1789, Louis XVI tente d'annuler les décisions prises par les députés\net leur ordonne de se séparer, en les expulsant de la salle du Jeu de paume\ngrâce à l'armée royale.\n\nCependant les députés refusent. Mirabeau, un grand orateur soutenu\nnotamment par l'abbé Sieyès, affirme que les députés ne quitteront les lieux\nque s'ils y sont contraints par la force :​\n« Allez dire à votre maître que nous sommes ici par la volonté et qu'on ne nous\nen arrachera que par la puissance des baïonnettes. »\n\nFace à cette opposition, le roi finit par accepter la réunion des députés.\n\nLe pouvoir du roi est donc fortement remis en cause par l'affirmation de la\nsouveraineté nationale.\n\n2. Le peuple en révolution durant l'été 1789\nLa Révolution ne se limite pas aux députés : le peuple intervient également\ndirectement dans les événements.\n\n14 juillet 1789 : la prise de la Bastille\nÀ Paris, la situation est très tendue. Le renvoi de Necker le 11 juillet, ministre\napprécié du peuple, ainsi que la présence de troupes autour de Paris font\ncraindre une intervention militaire contre la Révolution.\n\nLe 14 juillet 1789, les Parisiens se soulèvent et prennent la Bastille, une\nforteresse-prison qui symbolise l'arbitraire royal.\n\nIls cherchent notamment à récupérer des armes et de la poudre."}, {"title": "Partie 3 · cours intégral", "content": "La prise de la Bastille devient un symbole majeur de la Révolution française et\nmontre que le peuple peut désormais intervenir directement dans la vie\npolitique.\n\fLa Grande Peur dans les campagnes\nÀ partir de juillet 1789, une Grande Peur se répand dans les campagnes\nfrançaises.\n\nLes paysans, qui meurent véritablement de faim, se révoltent face aux\nseigneurs. En effet, une rumeur tourne disant que ceux-ci paieraient des\nbrigands pour piller les villages. Ils attaquent certains châteaux, provoquant\nune violence nettement supérieure à celle du 14 juillet.\n\nCette révolte pousse les nobles à prendre des mesures contre les privilèges.\n\nC. L'abolition des privilèges\n\n1. La nuit du 4 août 1789\nPour trouver une solution aux difficultés du royaume et calmer les révoltes du\npeuple, les députés se réunissent à Versailles.\n\nDans la nuit du 4 août 1789, les députés de la noblesse, notamment les comtes\nde Noailles et d'Aiguillon, proposent d'abolir les privilèges.\n\nLes députés votent alors l'abolition du privilège féodaux, des droits\nseigneuriaux et de nombreux avantages dont bénéficient la noblesse et le\nclergé. Cette décision permet de mettre fin aux inégalités entre les ordres.\n\nÀ partir du 4 août 1789, la société d'ordres de l'Ancien Régime est\nprofondément remise en cause. C'est une véritable rupture avec l'Ancien\nRégime.\n\nIl faut désormais réorganiser la société et établir de nouveaux principes fondés\nsur l'égalité des citoyens."}, {"title": "Partie 4 · cours intégral", "content": "2. La Déclaration des droits de l'homme et du citoyen : 26 août 1789 (p.\n18 - Qu° 1 à 7)\n   1.​ Il s'agit de la DDHC, adoptée le 26 août 1789, par l'A. nationale pendant\n      la Révolution française. Elle énonce les droits et libertés fondamentaux\n      des citoyens.\n   2.​ Selon l'article 2, ce sont la liberté, la propriété, la sûreté et la résistance à\n      l'oppression.\n\f   3.​ Les articles 1, 6 et 13 suppriment les privilèges liés aux ordres et à la\n      naissance. Ils affirment que tous les citoyens sont égaux devant la loi et\n      que les emplois publics sont accessibles à tous selon leurs capacités.\n   4.​ Les articles 3 et 14 affirment que la souveraineté appartient à la nation et\n      non plus au roi seul. Les citoyens participent à la formation des lois et au\n      consentement à l'impôt, directement ou par leurs représentants.\n   5.​ Les articles 7, 8 et 9 établissent :\n          ○​ nul ne peut être arrêté ou détenu arbitrairement ;\n          ○​ les peines doivent être prévues par la loi ;\n          ○​ toute personne est présumée innocente jusqu'à ce qu'elle soit\n             déclarée coupable.\n   6.​ Article 10 : liberté d'opinion, notamment religieuse. -> liberté de culte.\n      Article 11 : liberté d'expression et de communication, notamment la\n      liberté de parler, écrire et imprimer.\n   7.​ Selon l'article 17, la propriété est un droit inviolable et sacré. Elle ne peut\n      être confisquée que si une nécessité publique l'exige, avec une\n      indemnisation juste et préalable.\n\nD. La fin de l'absolutisme\n\n1. Les journées d'octobre 1789\nLes 5 et 6 octobre 1789, la marche des femmes de Paris à Versailles a lieu.\nEntre 6 000 et 7 000 personnes vont à Versailles pour réclamer plusieurs\nchoses au roi :\n\n●​ du pain ;\n   ●​ qu'il signe l'abolition des privilèges et la DDHC ;\n   ●​ qu'il revienne à la capitale.\n\nLes manifestants, armés, massacrent majordomes et gardes à Versailles. Le roi\nfinit par céder et signe les décrets, puis revient à Paris, au palais des Tuileries.\n\nIl n'est plus monarque absolu, car il se fait désormais dicter et surveiller par le\npeuple.\n\nIl est roi des Français, et non plus roi de France. De plus, un suffrage censitaire\n(vote autorisé si on paye un impôt, le cens) est instauré et on voit apparaître\ndes départements.\n\f2. L'unité célébrée : la fête de la fédération le 14 juillet 1790\nLe roi a donc perdu beaucoup de pouvoir. Il organise donc une grande fête sur\nle Champ-de-Mars pour commémorer la prise de la Bastille."}, {"title": "Partie 5 · cours intégral", "content": "Cet événement était pourtant une attaque à l'arbitraire royal. Néanmoins, la fête\na attiré plus de 350 000 personnes.\n\nCette fête rappelait aussi la séparation des trois pouvoirs, exécutif, législatif et\njudiciaire, mise en place lors de l'adoption de la DDHC le 26 août 1789.\n\nLouis XVI prête alors serment à la nation, à la loi et au roi, à lui-même, ce qui\nfait de la France une monarchie constitutionnelle.\n\nII. De la souveraineté royale à la souveraineté nationale\n(1790-1799)\n\nA. Un nouvel ordre politique (1791)\n\n1. Des débats politiques nouveaux\nLe peuple s'intéresse de plus en plus à la politique et de nombreux débats ont\nlieu.\n\nDifférents endroits permettent de discuter de politique :\n\n●​ le club des Jacobins, avec Robespierre et Saint-Just ;\n   ●​ le club des Cordeliers, avec Danton, Marat et Camille Desmoulins ;\n   ●​ les salons de femmes, recevant des savants, des écrivains et des\n        artistes, comme ceux de Mme. Roland ou de Mme. Geoffrin.\n\nManon Roland (1754-1793)\nManon Roland est une femme politique et une figure importante de la\nRévolution française. Proche des Girondins, elle participe activement à la vie\npolitique révolutionnaire et influence les décisions de son mari, ministre de\nl'Intérieur. Elle est arrêtée en 1793 lors de la chute des Girondins et exécutée le\n8 novembre 1793.\n\nLa presse est aussi un vecteur de la diffusion des idées révolutionnaires. En\neffet, son développement est très rapide et elle constitue le média de l'époque.\n\fDe plus, elle représente et valorise la liberté d'expression et de publication, et\nelle affronte la censure.\n\nComme journalistes révolutionnaires, on retrouve C. Desmoulins, Marat ou\nencore Mirabeau.\n\n2. Une nouvelle constitution\nLe 13 septembre 1791, la Constitution est promulguée. Elle consacre la\nsouveraineté de la nation : selon ce principe, le pouvoir appartient à la nation,\nformée de citoyens.\n\nElle va diminuer et limiter le pouvoir du roi : celui-ci ne possède que le pouvoir\nexécutif.\n\nUne assemblée législative est élue par les Français au suffrage censitaire, afin\nde partager le pouvoir législatif. Les conditions pour voter sont : être un\nhomme, avoir plus de 25 ans et payer le cens."}, {"title": "Partie 6 · cours intégral", "content": "Schéma de la Constitution de 1791 :\n   ●​ La nation : Constituée de citoyens riches, âgés d'au moins 25 ans\n      (Suffrage censitaire). SOUVERAINE, délègue ses pouvoirs à :\n            a.​ Une assemblée Législative (Pouvoir législatif) : indissoluble, 745\n               membres élus pour 2 ans.\n                  ■​ Établit le montant de l'impôt\n                  ■​ Propose et vote les lois\n                  ■​ Ratifie les déclarations de guerre et les traités de paix\n            b.​ Un roi des Français (Pouvoir exécutif) : héréditaire, inamovible, lié\n               par serment à la Constitution.\n                  ■​ Nomme et révoque les ministres\n                  ■​ Fait exécuter la loi mais possède un veto suspensif de 4 ans\n                      (propose guerre et paix à l'assemblée)\n\nLe roi possède également le droit de veto, qui lui permet de refuser et bloquer\ndes lois votées par l'assemblée législative.\n\nLa Constitution crée donc une monarchie constitutionnelle.\n\fLe 12 juillet 1790, la Constitution civile du clergé est adoptée.​\nLe clergé est désormais salarié par l'État, les évêques, curés et prêtres sont\nélus et doivent prêter serment à la nation, à la loi et au roi.\n\nIl existe alors deux types de prêtres :\n\n●​ ceux qui acceptent de prêter serment : les prêtres jureurs ;\n   ●​ ceux qui refusent de prêter serment : les prêtres réfractaires.\n\nL'Église se divise alors.\n\nB. L'échec de la monarchie constitutionnelle (1791-1793)\n\n1. La fuite à Varennes : 21 juin 1791\nLe roi a prêté serment mais désapprouve la plupart des réformes politiques et\nsociales. Il a seulement accepté sous la pression des événements et du peuple.\n\nIl va fuir Paris pour Montmédy. Il part avec sa famille et des domestiques pour\nrejoindre un bastion de royalistes, qui l'aideraient à reprendre le pouvoir absolu.\n\nLe 21 juin 1791, il s'arrête à Varennes pour faire étape, déguisé en valet.\nCependant, au moment de payer un aubergiste, il se fait reconnaître sur une\npièce de monnaie.\n\nIl est donc ramené de force à Paris.\n\nCette fuite provoque une rupture de confiance entre le peuple français et le roi.\nToutefois, il n'y a aucune preuve suffisante pour condamner le roi, seulement\ndes soupçons.\n\n2. La guerre contre l'Autriche, une nouvelle trahison ?\nLa Révolution française inquiète les monarchies européennes, qui craignent sa\npropagation. Louis XVI espère profiter de la guerre pour retrouver son pouvoir\net compte notamment sur l'aide des monarchies étrangères."}, {"title": "Partie 7 · cours intégral", "content": "En avril 1792, après un accord passé avec son beau-frère, empereur\nd'Autriche, et l'état-major austro-hongrois, Louis XVI déclare la guerre à\nl'Autriche. Il cherche ainsi à récupérer son pouvoir absolu, en faisant reculer\nl'armée autrichienne, suite à son accord.\n\fCependant, côté ennemi, seul l'état-major avait connaissance du plan. Donc\nl'armée d'Autriche arrive facilement aux portes de la capitale. Et le 11 juillet\n1792, suite à cette avancée, on déclare la « patrie en danger ». Le pari risqué\nde Louis XVI a ainsi échoué.\n\nLe 25 juillet 1792, le duc de Brunswick, commandant en chef des armées\nprussiennes, publie un manifeste au nom des puissances étrangères. Il menace\nles révolutionnaires et affirme que Paris pourrait être détruite si la famille royale\nétait menacée. Ce texte, une grosse erreur de révélation, renforce fortement la\ncolère contre le roi.\n\nLe 10 août 1792, les sans-culottes et les fédérés attaquent le palais des\nTuileries où réside la famille royale, suite à un appel des députés. Les gardes\nsuisses défendent le palais, mais sont finalement vaincus et finissent même par\nchanger de camp.\n\nLe roi cherche à se réfugier auprès de l'Assemblée législative, qui siège à\nproximité, pensant gagner sa protection. Au contraire, celle-ci est du côté du\npeuple.\n\nIl se fait donc arrêter et emprisonner avec la famille royale. La monarchie est\nainsi suspendue, et l'Assemblée nationale va élire au suffrage universel la\nConvention, une nouvelle assemblée, au cours du mois d'août 1792.\n\nC. 1792, la France en république\n\n1. La Première République : un nouveau régime politique\nLe 20 septembre 1792, les Français révolutionnaires remportent la bataille de\nValmy contre les armées prussiennes.\n\nLe lendemain, le 21 septembre 1792, la Convention nationale est élue au\nsuffrage universel masculin (+21 ans). Le même jour, elle abolit officiellement la\nmonarchie.\n\nLe 22 septembre 1792, elle proclame la République. Cette date marque le début\nde la Première République.\n\nLa Convention réunit trois groupes de députés :\n\f   ●​ les Montagnards : députés révolutionnaires les plus radicaux et proches\n      du peuple, notamment Robespierre et Danton ;\n   ●​ les Girondins : révolutionnaires plus modérés, favorables à une\n      République décentralisée ;\n   ●​ la Plaine (ou le Marais) : groupe de députés situé au centre, qui peut\n      soutenir les Montagnards ou les Girondins selon les circonstances.\n\nLa Convention réalise aussi son premier acte politique fort : le procès de Louis\nXVI. Il est accusé notamment de trahison et de complot contre la Révolution."}, {"title": "Partie 8 · cours intégral", "content": "Il est condamné à mort et guillotiné le 21 janvier 1793 sur la place de la\nRévolution, à Paris.\n\n2. La patrie en danger\nLa Coalition des monarchies européennes cherche à aider les opposants à la\nRévolution, en s'alliant à l'Autriche, et à arrêter la propagation des idées\nrévolutionnaires en France.\n\nLa Révolte en Vendée, une région très royaliste et catholique, commence en\n1793. Les Vendéens s'opposent à la République et veulent restaurer une\nroyauté. Les Montagnards sont favorables à la bataille contre les Vendéens,\ntout comme les Girondins, mais ceux-ci sont jugés trop modérés et inactifs.\n\nAinsi, le 2 juin 1793, les Montagnards arrêtent et exécutent les principaux\ndéputés girondins. C'est la chute des Girondins. Les Montagnards prennent\nalors le contrôle de la Convention.\n\nElle devient alors plus radicale afin de faire face aux nombreux dangers qui\nmenacent la République.\n\nCependant, les Fédérés refusent la chute des Girondins et s'opposent au\npouvoir des Montagnards. Ils ne voient plus la République comme ils\nl'entendent.\n\nLa République doit donc faire face à trois grands dangers :\n\n●​ la guerre contre les monarchies européennes ;\n   ●​ la révolte vendéenne ;\n\f   ●​ les insurrections des Fédérés.\n\n3. La Terreur (1793-1794)\nLe Comité de salut public, créé le 6 avril 1793, est chargé de mener une\npolitique d'urgence pour défendre la République. Il compte 12 membres. À\npartir de juillet 1793, Robespierre en devient l'un des principaux dirigeants.\n\nLe Comité met en place plusieurs mesures :\n\n●​ La loi des maximums, en mai 1793, fixe des prix maximums à ne pas\n      dépasser pour certaines denrées, afin de lutter contre la hausse des prix\n      ;\n   ●​ La loi des suspects, en septembre 1793, permet d'arrêter les personnes\n      considérées comme ennemies de la République ou soupçonnées de\n      s'opposer à la Révolution. Sont considérés suspects les Girondins, ceux\n      qui ont dans leur entourage parents, cousins, amis, des personnes qui\n      n'ont pas manifesté leur attachement à la République. Les suspects sont\n      arrêtés et emprisonnés.\n\nLa levée en masse, décidée le 23 août 1793, permet de recruter massivement\ndes soldats pour défendre la République contre les armées étrangères. Elle\nentraîne la mobilisation de la nation pour la guerre.\n\nLa déchristianisation se développe en 1793-1794. Des révolutionnaires\ncherchent à réduire l'influence du christianisme : le calendrier républicain est\nadopté en octobre 1793 (An I de la République, An II,...).\n\nLes révolutionnaires sont cependant divisés :"}, {"title": "Partie 9 · cours intégral", "content": "●​ Danton et à la tête des Indulgents, qui souhaitent modérer la Terreur et\n      mettre fin aux mesures d'exception ;\n   ●​ Hébert dirige les Enragés, révolutionnaires très radicaux qui souhaitent\n      au contraire poursuivre et renforcer la Terreur.\n\nFace à la Terreur, la Convention charge Danton de demander à Robespierre\nd'atténuer les lois. Il est directement suspecté, et se fait arrêter, par la loi des\nsuspects. Danton est guillotiné le 5 avril 1794.\n\fDe son côté, Hébert veut largement empirer la Terreur. Cela agace\nRobespierre, qui le fait à son tour exécuter.\n\nCe dernier acte fait comprendre à la Convention que Robespierre cherche à\nobtenir un pouvoir dictatorial, s'opposant entièrement à la République.\n\nElle fait alors arrêter Robespierre le 27 juillet 1794, ou le 9 thermidor An II. Ceux\nqui ont renversé Robespierre sont nommés les Thermidoriens, et le feront\nguillotiner le lendemain, le 28 juillet 1794 (10 thermidor An II), sans procès.\n\nAinsi, la Terreur et les lois qui lui sont associées sont officiellement abolies.\nCependant, ce régime reste l'une des premières dérives républicaines.\n\nIII. Une nation canalisée et conquérante sous Napoléon\nBonaparte (1799-1815)\n\nA. Les régimes napoléoniens (Consulat et Empire) : des régimes\nautoritaires\n\nTRANSITION ENTRE LE DIRECTOIRE ET LE CONSULAT\nLe 9 novembre 1799 (18 Brumaire an VIII), Napoléon réalise un coup d'État qui\nmet fin au Directoire. Profitant de l'impopularité du régime et du désir de\nstabilité des élites et du peuple, il instaure le Consulat, avec lui-même comme\nPremier Consul. Ce changement incarne la fin définitive de la Révolution telle\nqu'elle avait commencé et ouvre une nouvelle ère politique. Officiellement\njustifié par la nécessité de garantir la sécurité et la grandeur nationale, ce coup\nd'État inaugure une période d'autoritarisme éclairé, avec la promesse d'un\ngouvernement fort capable de sortir la France du chaos révolutionnaire."}, {"title": "Partie 10 · cours intégral", "content": "En août 1795, la Convention adopte la Constitution de l'an III, qui met en place\nun nouveau régime politique : le Directoire. Cette constitution cherche à éviter\nqu'une seule personne ne concentre tous les pouvoirs, comme cela avait été le\ncas avec Robespierre. Le pouvoir exécutif est confié à un Directoire composé\nde cinq membres, tandis que le pouvoir législatif est partagé entre deux\nassemblées : le Conseil des Cinq-Cents et le Conseil des Anciens. Ces\ninstitutions sont censées se contrôler mutuellement afin de garantir un meilleur\néquilibre des pouvoirs.\n\fCette nouvelle constitution réduit également les avancées démocratiques de la\nRévolution. Le suffrage universel masculin, instauré après la chute de la\nmonarchie en 1792, est supprimé et remplacé par le suffrage censitaire, qui\nréserve le droit de vote aux citoyens les plus riches. Le pouvoir passe ainsi\ndavantage aux mains d'une bourgeoisie modérée et conservatrice. Ce choix\nest critiqué par les révolutionnaires les plus radicaux, mais il répond à la\nvolonté de stabiliser un pays marqué par plusieurs années de crise et de\nviolences.\n\nMalgré ces réformes, le Directoire reste un régime fragile. La France traverse\nune grave crise économique : l'inflation augmente, le chômage progresse et les\npénuries alimentaires provoquent régulièrement des difficultés pour la\npopulation. Les tensions sociales sont importantes, notamment dans les\ngrandes villes, où de nombreux citoyens réclament davantage de justice\nsociale. Sur le plan politique, le régime peine également à s'imposer\ndurablement.\n\nC'est dans ce contexte d'instabilité politique, de difficultés économiques et de\nguerre contre les puissances européennes qu'émerge la figure de Napoléon\nBonaparte. Général victorieux et très populaire, il apparaît pour beaucoup\ncomme l'homme capable de rétablir l'ordre et de redonner de la stabilité au\npays.\n\nNapoléon a plusieurs atouts, parmi lesquels la Grande Armée (= armée\nnapoléonienne), qui lui est entièrement dévouée et lui permet de réaliser son\ncoup d'État.\n\nDe plus, son frère Lucien Bonaparte est président du Conseil des 500, facilitant\nainsi à Napoléon son coup d'État.\n\nAprès son coup d'État du 18 brumaire An VIII (9 novembre 1799), Napoléon se\nnomme Premier Consul, en référence à l'Empire romain. En effet, il était la\npersonne la plus puissante dans l'Empire. Il met ainsi en place le Consulat."}, {"title": "Partie 11 · cours intégral", "content": "En 1802, il s'autoproclame Consul à vie. Un sentiment de résurrection de la\nmonarchie absolue naît alors chez les Français.\n\fEn tant que Premier Consul, il possède le pouvoir exécutif et plus ou moins le\npouvoir législatif : c'est lui qui nomme le Sénat et le Conseil d'État. En réalité, il\npossède tout le pouvoir, mais il cherche à en donner une apparence plus\nlégitime.\n\nEn effet, les citoyens peuvent élire les membres des assemblées, mais la liste\ndes candidats est contrôlée par Bonaparte. En outre, ils sont consultés grâce à\ndes plébiscites (= référendums).\n\nEn 1802, il signe un traité de paix avec l'Autriche, ce qui entraîne la fin de la\nlevée en masse. Il a donc apporté beaucoup à la France : il stabilise la situation\npolitique, relance l'économie,...\n\nAinsi, en 1804, il se nomme Empereur, ce qui est approuvé par les Français. Il\nest sacré le 2 décembre 1804 et détient le titre de Napoléon Ier.\n\n1. Organigramme du régime sous Napoléon Bonaparte : Premier consul\npuis empereur des Français (1804)\n   ●​ NAPOLÉON BONAPARTE : Premier consul puis empereur des Français\n      (1804)\n            ○​ Nomme et révoque les ministres\n            ○​ Propose et promulgue les lois\n            ○​ Commande les armées\n            ○​ Nomme :\n                  ■​ Conseil d'État : prépare les lois\n                  ■​ Sénat : vérifie les lois (nomme les membres des assemblées\n                     d'après les listes de candidats)\n            ○​ Consultatif : 2e et 3e consuls (Pouvoir consultatif)\n   ●​ Citoyens français (Suffrage universel masculin / Corps électoral) :\n            ○​ Élisent la liste de candidats -> choisies par le Sénat pour former :\n                  ■​ Tribunat : discute les projets de loi\n                  ■​ Corps législatif : vote les projets de loi\n            ○​ Approuvent par Plébiscite\n   ●​ Légende : Pouvoir exécutif | Pouvoir législatif | Corps électoral​\n      |---|\n\f2. Napoléon supprime les libertés\nEn France, tout le monde est surveillé : Napoléon possède des espions partout\ngrâce à la police, dont le ministre est Joseph Fouché. Il supprime la liberté\nd'opinion politique, la liberté d'expression et rétablit la censure de la presse,\nafin d'éviter un contre-pouvoir potentiel. Il instaure ainsi un pouvoir autoritaire\net personnel.\n\nB. La nation renforcée par un cadre"}, {"title": "Partie 12 · cours intégral", "content": "1. La pacification de la France\nNapoléon va restaurer une paix religieuse. Il signe un concordat (= traité entre\nle Pape et un État, qui définit les relations entre l'Église et cet État), avec Pie\nVII, en 1801. La liberté de culte est donc garantie, malgré le fait que le\ncatholicisme soit reconnu comme la religion de « la grande majorité des\nFrançais ».\n\nCe compromis entraîne plusieurs changements :\n\n●​ L'État fait certaines concessions, tandis que l'Église en fait d'autres.\n   ●​ L'Église renonce à tout ce qui lui a été confisqué lors de la Révolution.\n   ●​ Les prêtres et évêques vont être rémunérés par l'État.\n\nNapoléon va aussi réussir à mettre fin à la guerre contre l'Autriche, par le traité\nde Lunéville en 1801. De plus, en 1802, le traité d'Amiens avec le Royaume-Uni\nva mettre fin à la guerre contre l'entièreté des monarchies européennes et\nmarque un retour à la paix.\n\n2. La reconstruction et la modernisation de l'État\nNapoléon Bonaparte met en place une administration centralisée. Dans chaque\ndépartement, il place un préfet chargé de représenter le pouvoir centralisé.\n\nEn 1802, il invente les lycées pour former les jeunes à devenir des\nfonctionnaires compétents et fidèles, dont préfet.​\nIl crée aussi la Légion d'honneur, une médaille qui récompense les meilleurs\nfonctionnaires.\n\nNapoléon va aussi faire oublier la Révolution, en pacifiant la France, et en\nmaintenant un certain nombre d'acquis obtenus.\n\fMalgré les traités de paix, il prévoit de faire la guerre grâce à son armée, la\nGrande Armée. Il veille à son bon fonctionnement.​\nEntre 1805 et 1811, il fait la conquête de la quasi-totalité de l'Europe.\n\nIl va aussi réorganiser les finances de la France, en créant la Banque de\nFrance, qui a le monopole de l'émission monétaire des papiers. Il crée aussi le\nFranc Germinal, une monnaie puissante qui va relancer l'économie.​\nIl va unifier les poids et les mesures. On mesure désormais en grammes,\nkilogrammes, litres, décilitres,... partout en France.​\nCes deux éléments vont relancer la consommation.\n\nLes grandes institutions civiles créées par Napoléon sont appelées les «\nmasses de granit ».\n\n3. Le Code civil (1804)\nLe Code civil, promulgué par Napoléon Bonaparte le 21 mars 1804 est un\nrecueil de toutes les lois fixant les bases des relations sociales entre les\nindividus.\n\nTous les citoyens sont égaux devant la loi. Cependant, les lois n'égalisent pas\nles citoyens entre eux. En effet, par exemple, le père de famille occupe une\nplace prépondérante : le mari et la femme sont inégaux sur le divorce et elle lui\ndoit obéissance."}, {"title": "Partie 13 · cours intégral", "content": "Ainsi, Napoléon voulait créer une société hiérarchisée, avec des libertés\ncomme la liberté de cultes, mais tout en les verrouillant un peu.\n\nIl est donc considéré comme un très bon homme politique, car il arrive à\nséduire le peuple tout en conservant un contrôle étroit sur ses libertés.\n\nC. La nation française : un modèle pour l'Europe ?\nLa Nation française souhaite répandre la DDHC et son universalité, étant ainsi\nun modèle de nation à suivre, notamment grâce à Napoléon.\n\nCelui-ci mène des guerres de libération dans le but de diffuser un modèle\npolitique bénéfique aux autres nations, afin de les affranchir de l'autorité des\n\fmonarchies. Dès 1804, celles-ci sont inquiètes de la montée en puissance de la\nFrance et de Napoléon.\n\n●​ En octobre 1805, la France subit une lourde défaite face aux Anglais lors\n       de la Bataille de Trafalgar.\n   ●​ En décembre 1805, Napoléon remporte une victoire décisive contre\n       l'Autriche lors de la bataille d'Austerlitz.\n   ●​ En 1806, Napoléon remporte une victoire contre la Prusse lors de la\n       bataille d'Iéna.\n   ●​ En 1809, il remporte la Bataille de Wagram encore contre l'Autriche.\n\nEn 1811, l'Empire est à son apogée et couvre toute l'Europe de l'Ouest, excepté\nl'Angleterre et le Portugal.\n\nL'Empire français compte 130 départements, transformés en États vassaux\nentièrement soumis à l'Empereur et dirigés par des membres de la famille de\nNapoléon ou par des souverains alliés. La Prusse, l'Autriche et la Russie sont\ndes alliés.\n\nPour diffuser les idées de la Révolution, il va obliger le Code civil partout, qui\nreconnaît l'égalité des citoyens devant la loi et la fin du privilège.\n\nLa Grande Armée est initialement bien accueillie par les populations\nétrangères, car elle est perçue comme une force de libération des nations\neuropéennes face aux monarchies, aux privilèges et aux droits féodaux. Elle se\nprésente ainsi comme une armée libératrice.\n\n2. L'affirmation des nations contre la France\nUne fois sur place, la Grande Armée se met à piller et à massacrer les\npopulations locales, qui sont également soumises à de lourds impôts. Son\nimage d'armée libératrice disparaît alors progressivement.\n\nLe 2 mai 1808, les habitants de Madrid se soulèvent contre l'occupation\nfrançaise. Le lendemain, le 3 mai, Napoléon ordonne une répression sévère, au\ncours de laquelle la Grande Armée exécute de nombreux hommes madrilènes."}, {"title": "Partie 14 · cours intégral", "content": "Face à cette oppression, les populations des pays conquis développent un fort\nsentiment national, c'est-à-dire un sentiment d'appartenance à une même\n\fnation. Ce sentiment les pousse à se révolter contre la domination\nnapoléonienne et à lutter pour leur indépendance.\n\n3. Revers et déclin (1812-1815)\nFace aux nombreuses révoltes qui éclatent dans les pays conquis, Napoléon\nBonaparte poursuit ses conquêtes, notamment avec la campagne de Russie en\n1812.\n\nLa Grande Armée s'enfonce profondément en Russie et doit affronter des\nconditions climatiques extrêmement difficiles, notamment un hiver\nparticulièrement rigoureux, avec des températures pouvant atteindre -40 °C.\nL'armée française est alors décimée par le froid, la faim et les difficultés du\nretrait.\n\nLors de la retraite, la G.-A. doit franchir la Bérézina, un fleuve situé en Russie.\nLes ponts construits pour permettre le passage des soldats cèdent sous la\npression, provoquant la mort de nombreux soldats, victimes de la noyade et du\nfroid. La campagne de Russie constitue ainsi un tournant majeur et marque le\ndébut du déclin de Napoléon Bonaparte.\n\nEn 1813, il subit une lourde défaite lors de la bataille de Leipzig.​\nEn avril 1814, il abdique et est contraint de s'exiler sur l'île d'Elbe. La monarchie\nconstitutionnelle est alors restaurée en France avec Louis XVIII sur le trône.\n\nEn mars 1815, Napoléon s'échappe de l'île d'Elbe et reprend le pouvoir,\nmarquant le début des Cent-Jours. Cependant, il est définitivement vaincu lors\nde la bataille de Waterloo, le 18 juin 1815, face aux Anglais. Cette défaite met\nofficiellement fin à l'empire napoléonien. Napoléon est alors exilé sur l'île de\nSaint-Hélène, où il meurt en 1821."}, {"title": "Partie 15 · cours intégral", "content": "Le Congrès de Vienne, qui se déroule de septembre 1814 à juin 1815, réunit les\nprincipales puissances européennes afin de réorganiser l'Europe après les\nguerres napoléoniennes. Les vainqueurs redessinent les frontières et\nrestaurent de nombreuses monarchies. Le principe des nationalités est\nlargement ignoré, ce qui provoque de nouvelles tensions et nourrit les\nrevendications nationales en Europe. L'objectif est également d'empêcher le\nretour d'une nouvelle domination française et de maintenir un équilibre entre\nles grandes puissances européennes.\n\fConclusion :\nDurant cette longue période révolutionnaire, les Français ont réformé puis\nrenversé la monarchie et mis fin à la société d'ordres. La France impose une\nnouvelle conception du pouvoir où la Nation est souveraine mais aussi de\nnouveaux idéaux politiques comme l'égalité devant la loi, les libertés\nfondamentales ou les droits de l'Homme et du citoyen. La Révolution et l'Empire\nont entraîné de profonds bouleversements politiques en France et\ngéopolitiques en Europe. Les Français font l'apprentissage de la politique et de\nla nation par les mouvements populaires, les suffrages et les révoltes.\n\nSi les débuts de la République sont incertains et connaissent des dérives, les\nidées libérales et nationales sont bien ancrées dans de nombreux États\nd'Europe."}]};
const $=s=>document.querySelector(s);
const state={mode:'home',cardIndex:0,showAnswer:false,quizList:[],qIndex:0,results:[],selected:null,exam:false,chunkIndex:0,showCourseAnswer:false,urgentMinutes:45};
let progress={attempts:0,correct:0,errors:[],known:{},history:[]};
try{progress={...progress,...JSON.parse(localStorage.getItem('revisionUrgenceV1')||'{}')}}catch(e){}
const modes=[['home','Accueil'],['learn','Apprendre'],['cards','Flashcards'],['quiz','Quiz'],['urgent','Mode urgence'],['exam','Simulation'],['errors','Mes erreurs'],['dash','Progrès']];
function save(){try{localStorage.setItem('revisionUrgenceV1',JSON.stringify(progress))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function go(m){state.mode=m;render()}
function nav(){
 const icons={home:'⌂',learn:'§',cards:'▤',quiz:'◎',urgent:'↗',exam:'≡',errors:'↺',dash:'◫'};
 $('#nav').innerHTML=modes.map(([id,label])=>`<button type="button" class="${state.mode===id?'active':''}" ${state.mode===id?'aria-current="page"':''} onclick="go('${id}')"><span class="nav-glyph" aria-hidden="true">${icons[id]||'·'}</span><span>${label}</span></button>`).join('')
}
function shell(content){nav();$('#app').innerHTML=`<div class="screen">${content}</div>`}
function home(){
let mastered=Object.values(progress.known).filter(x=>x>=2).length;
let rate=progress.attempts?Math.round(progress.correct/progress.attempts*100):0;
let next=progress.errors.length?"Reprendre les notions fragiles":"Lancer le diagnostic";
return `<div class="home-layout">
<section class="card home-hero"><div><div class="hero-kicker">Ton espace de préparation · contrôle demain</div><h2>Comprendre.<br>Mémoriser.<br>Être prêt.</h2><p>Un parcours de révision construit autour de ton cours intégral. Commence par repérer ce que tu sais, puis concentre ton énergie sur ce qui reste fragile.</p><div class="actions"><button onclick="${progress.errors.length?"startQuiz('errors')":"startQuiz('diagnostic')"}">${next} <span aria-hidden="true">↗</span></button><button class="secondary" onclick="go('learn')">Ouvrir le cours</button></div></div><div class="hero-foot"><div><strong>${DATA.chunks.length}</strong><span>parties de cours</span></div><div><strong>${DATA.cards.length}</strong><span>cartes de rappel</span></div><div><strong>1789—1815</strong><span>période étudiée</span></div></div></section>
<aside class="home-side"><section class="card progress-panel"><div><div class="section-label">Vue d’ensemble</div><div class="progress-top"><div><h3>Ta progression</h3><p class="muted small">${progress.attempts?`${progress.attempts} questions traitées`:"Le point de départ, c’est maintenant."}</p></div><div class="progress-ring" style="--progress:${rate}%"><span>${progress.attempts?rate+"%":"—"}</span></div></div><div class="bar" style="margin:20px 0 10px"><span style="width:${rate}%"></span></div><p class="muted small">${progress.attempts?`${progress.correct} réussite(s) déclarée(s) sur ${progress.attempts} réponses évaluées.`:"Les résultats s’afficheront ici au fil de tes séances."}</p></div><div class="stat"><span>Notions consolidées</span><b>${mastered} / ${DATA.cards.length}</b></div><div class="stat"><span>À revoir</span><b>${progress.errors.length}</b></div></section><section class="card" style="background:var(--goldPale);border-color:#e6dac0"><div class="section-label">Méthode conseillée</div><h3>Rappel actif d’abord</h3><p class="small">Essaie de restituer avant de relire. Une erreur identifiée devient une priorité de révision, pas une impasse.</p><button class="secondary" onclick="go('urgent')">Choisir mon parcours</button></section></aside></div>
<div class="mode-heading"><div><div class="section-label">Choisis ton rythme</div><h2>Un mode pour chaque étape</h2></div><p class="muted small">Des outils complémentaires, un même objectif.</p></div><div class="grid">
<section class="card mode-card accent"><div class="mode-index">01</div><h3>Diagnostic</h3><p>Repère rapidement les notions à renforcer avant de te lancer.</p><button onclick="startQuiz('diagnostic')">Faire le point ↗</button></section>
<section class="card mode-card"><div class="mode-index">02</div><h3>Apprendre le cours</h3><p>Retrouve le contenu intégral, organisé en ${DATA.chunks.length} parties.</p><button class="secondary" onclick="go('learn')">Lire le cours</button></section>
<section class="card mode-card"><div class="mode-index">03</div><h3>Flashcards</h3><p>Entraîne-toi à retrouver les dates, notions et événements de mémoire.</p><button class="secondary" onclick="state.quizList=shuffle(DATA.cards);state.cardIndex=0;state.showAnswer=false;go('cards')">Réviser les cartes</button></section>
<section class="card mode-card"><div class="mode-index">04</div><h3>Mode urgence</h3><p>Une session guidée selon le temps dont tu disposes : 15, 45 ou 90 minutes.</p><button class="secondary" onclick="go('urgent')">Lancer une session</button></section>
<section class="card mode-card"><div class="mode-index">05</div><h3>Examen blanc</h3><p>Teste ta restitution dans une session plus longue, sans correction immédiate.</p><button class="secondary" onclick="startQuiz('exam')">Commencer la simulation</button></section>
<section class="card mode-card"><div class="mode-index">06</div><h3>Mes erreurs</h3><p>${progress.errors.length?`${progress.errors.length} notion(s) à revoir sont enregistrées.`:"Les notions difficiles seront regroupées ici."}</p><button class="secondary" onclick="go('errors')">Voir les erreurs</button></section></div>
<div class="mode-heading"><div><div class="section-label">Cap sur demain</div><h2>Un plan simple, sans dispersion</h2></div></div><section class="card"><div class="grid"><div><div class="section-label">Étape 1</div><h3>Identifier</h3><p class="muted small">Diagnostic rapide pour distinguer les acquis des zones d’incertitude.</p></div><div><div class="section-label">Étape 2</div><h3>Renforcer</h3><p class="muted small">Revoir les erreurs, puis refaire un rappel sans regarder la réponse.</p></div><div><div class="section-label">Étape 3</div><h3>Valider</h3><p class="muted small">Terminer par une simulation et une dernière revue ciblée.</p></div></div><p class="muted small">La progression est indicative : elle repose sur tes auto-évaluations, pas sur une correction automatique de réponses rédigées.</p></section>`;
}
function learn(){
 let c=DATA.chunks[state.chunkIndex];
 return `<div class="page-intro"><div class="section-label">Le cours · lecture active</div><h2>Comprendre la période</h2><p class="muted">Avance section par section. Lis, détourne les yeux, puis reformule les idées principales de mémoire.</p></div>
 <div class="course-layout"><aside class="course-rail card"><div class="section-label">Dans le cours</div>${DATA.chunks.map((part,i)=>`<button class="chapter-link ${i===state.chunkIndex?'active':''}" onclick="state.chunkIndex=${i};render()"><span class="chapter-number">${String(i+1).padStart(2,'0')}</span><span>${esc(part.title)}</span></button>`).join('')}</aside>
 <article class="card course-article"><div class="course-heading"><div class="stat"><span class="muted">Section ${String(state.chunkIndex+1).padStart(2,'0')} / ${DATA.chunks.length}</span><span class="pill">Cours intégral</span></div><div class="bar"><span style="width:${100*(state.chunkIndex+1)/DATA.chunks.length}%"></span></div><h2>${esc(c.title)}</h2><p class="muted small">Texte conservé à partir du document fourni.</p></div><div class="courseText">${esc(c.content)}</div><div class="actions"><button class="ghost" ${state.chunkIndex===0?'disabled':''} onclick="state.chunkIndex--;render()">← Précédente</button><button onclick="state.chunkIndex=Math.min(DATA.chunks.length-1,state.chunkIndex+1);render()" ${state.chunkIndex===DATA.chunks.length-1?'disabled':''}>${state.chunkIndex===DATA.chunks.length-1?'Dernière section':'Section suivante →'}</button><button class="secondary" onclick="startQuiz('quiz')">Vérifier mes connaissances</button></div></article></div>`;
}
function cardsMode(){
 let list=state.quizList.length?state.quizList:shuffle(DATA.cards);state.quizList=list;
 let c=list[state.cardIndex%list.length];
 return `<div class="page-intro"><div class="section-label">Rappel actif · flashcards</div><h2>Retrouve la réponse de mémoire.</h2><p class="muted">Ne retourne la carte qu'après avoir formulé une réponse, même imparfaite.</p></div>
 <section class="flash-session"><div class="flash-meta"><span>CARTE <b>${String(state.cardIndex+1).padStart(2,'0')}</b> <span class="muted">/ ${list.length}</span></span><span class="pill">${esc(c[2])}</span></div>
 <div class="flash-progress"><div class="bar"><span style="width:${100*(state.cardIndex+1)/list.length}%"></span></div></div>
 <div class="flashcard ${state.showAnswer?'is-flipped':''}" aria-live="polite"><div class="flashcard-inner">
 <div class="flash-face flash-front"><div class="flash-watermark">QUESTION</div><div class="flash-number">${String(state.cardIndex+1).padStart(2,'0')}</div><div class="question">${esc(c[0])}</div><p class="muted small">Prends quelques secondes pour chercher sans regarder.</p></div>
 <div class="flash-face flash-back"><div class="flash-watermark">RÉPONSE ATTENDUE</div><div class="section-label">À retenir</div><div class="flash-answer">${esc(c[1])}</div><div class="flash-source">${esc(c[2])}</div></div></div></div>
 <div class="flash-controls"><button class="ghost" onclick="moveCard(-1)">← Précédente</button><button onclick="state.showAnswer=!state.showAnswer;render()">${state.showAnswer?'Voir la question':'Retourner la carte'}</button><button class="secondary" onclick="moveCard(1)">Suivante →</button></div>
 ${state.showAnswer?`<div class="self-rating"><span class="muted small">Évalue honnêtement ton rappel</span><div class="actions"><button class="good" onclick="rateCard(true)">Je savais</button><button class="bad" onclick="rateCard(false)">À revoir</button></div></div>`:''}
 <div class="flash-bottom"><button class="ghost" onclick="state.quizList=shuffle(DATA.cards);state.cardIndex=0;state.showAnswer=false;render()">Mélanger les cartes</button><span class="muted small">Tes évaluations sont enregistrées localement.</span></div></section>`;
}
function rateCard(known){let c=state.quizList[state.cardIndex%state.quizList.length],key=c[0];progress.known[key]=known?(progress.known[key]||0)+1:0;if(!known)addError(c);progress.attempts++;if(known)progress.correct++;save();moveCard(1)}
function moveCard(d){state.cardIndex=(state.cardIndex+d+state.quizList.length)%state.quizList.length;state.showAnswer=false;render()}
function startQuiz(kind){state.mode=kind==='exam'?'exam':'quiz';state.quizKind=kind;state.quizList=shuffle(DATA.cards).slice(0,kind==='diagnostic'?15:kind==='exam'?25:12);if(kind==='errors'){let es=progress.errors;state.quizList=shuffle(es.map(e=>e.card)).slice(0,Math.max(1,es.length))}state.qIndex=0;state.results=[];state.selected=null;state.exam=kind==='exam';state.reveal=false;render()}
function quiz(){
 if(state.qIndex>=state.quizList.length)return quizEnd();let c=state.quizList[state.qIndex];
 let label=state.exam?'Simulation du contrôle':state.quizKind==='diagnostic'?'Diagnostic de départ':state.quizKind==='errors'?'Révision des erreurs':'Quiz ciblé';
 return `<div class="quiz-shell"><div class="quiz-topline"><button class="ghost" onclick="go('home')">← Quitter la session</button><span class="section-label">${label}</span></div><section class="card quiz-card">
 <div class="quiz-meta"><span class="question-count">QUESTION <b>${String(state.qIndex+1).padStart(2,'0')}</b><span class="muted"> / ${String(state.quizList.length).padStart(2,'0')}</span></span><span class="pill">${esc(c[2])}</span></div><div class="bar quiz-progress"><span style="width:${100*state.qIndex/state.quizList.length}%"></span></div>
 <div class="quiz-prompt"><div class="section-label">À toi de jouer</div><div class="question">${esc(c[0])}</div><p class="muted">Restitue les éléments essentiels avant d'afficher la correction. Le score est fondé sur ton auto-évaluation.</p></div>
 <label class="answer-label" for="typed">Ta réponse</label><textarea id="typed" rows="4" placeholder="Écris quelques mots-clés ou formule ta réponse à voix haute…"></textarea>
 ${state.exam?`<div class="notice">En simulation, le corrigé sera consultable dans le bilan final. Évalue ta réponse avec exigence.</div><div class="actions"><button class="good" onclick="answer(true)">Réponse maîtrisée</button><button class="bad" onclick="answer(false)">À retravailler</button><button class="ghost" onclick="skipQ()">Passer sans compter</button></div>`:state.reveal?`<div class="answer reveal-answer"><div class="section-label">Réponse attendue</div>${esc(c[1])}<p class="small muted">Partie du cours : ${esc(c[2])}</p></div><div class="actions"><button class="good" onclick="answer(true)">Je l’avais</button><button class="bad" onclick="answer(false)">À revoir</button></div>`:`<div class="actions"><button onclick="revealAnswer()">Afficher la correction</button><button class="ghost" onclick="skipQ()">Passer sans compter</button></div>`}
 </section><div class="quiz-foot"><span>Rappel actif</span><span>·</span><span>Une question à la fois</span><span>·</span><span>Sans chronomètre</span></div></div>`;
}
function revealAnswer(){state.reveal=true;render()}
function skipQ(){state.qIndex++;state.reveal=false;render()}
function addError(c){if(!progress.errors.some(e=>e.card[0]===c[0]))progress.errors.push({card:c,count:1});else progress.errors.find(e=>e.card[0]===c[0]).count++}
function answer(ok){let c=state.quizList[state.qIndex];state.results.push({card:c,ok});progress.attempts++;if(ok)progress.correct++;else addError(c);progress.history.push({topic:c[2],ok});save();state.qIndex++;state.reveal=false;render()}
function quizEnd(){
 let ok=state.results.filter(x=>x.ok).length,total=state.results.length,pct=total?Math.round(100*ok/total):0,missed=state.results.filter(x=>!x.ok);
 return `<div class="results-wrap"><div class="results-kicker">Session terminée · bilan personnel</div><section class="results-hero"><div><span class="pill">Bilan de séance</span><h2>${state.exam?'Simulation du contrôle':'Ton point d’étape'}</h2><p class="muted">${state.exam?'Un aperçu de ta restitution avant le contrôle.':'Chaque réponse te donne une indication sur ce qu’il faut revoir.'}</p></div><div class="result-score" style="--score:${pct*3.6}deg"><div><strong>${ok}<span>/${total}</span></strong><small>maîtrisées</small></div></div></section>
 <div class="results-stats"><div class="card"><div class="section-label">Réussite déclarée</div><div class="big">${pct}%</div><div class="bar"><span style="width:${pct}%"></span></div></div><div class="card"><div class="section-label">À retravailler</div><div class="big">${missed.length}</div><p class="muted small">notion(s) à revoir</p></div><div class="card"><div class="section-label">Questions traitées</div><div class="big">${total}</div><p class="muted small">dans cette session</p></div></div>
 <section class="card"><div class="section-label">Prochaine priorité</div><h3>${missed.length?'Revois ces notions avant de recommencer':'Consolide avec une nouvelle série'}</h3><p class="muted">${missed.length?'Relis les réponses attendues, fais une pause, puis essaie de les restituer sans aide.':'Tu as déclaré les réponses maîtrisées. Une nouvelle série permettra de vérifier que le rappel tient dans le temps.'}</p>
 ${missed.map((x,i)=>`<div class="review-item"><div class="review-index">${String(i+1).padStart(2,'0')}</div><div><b>${esc(x.card[0])}</b><p>${esc(x.card[1])}</p><span class="muted small">${esc(x.card[2])}</span></div></div>`).join('')||'<div class="answer">Aucune notion signalée comme fragile pendant cette session. Reviens les retester plus tard pour confirmer.</div>'}
 <div class="actions"><button onclick="startQuiz('errors')" ${!progress.errors.length?'disabled':''}>Revoir mes erreurs</button><button class="secondary" onclick="startQuiz('quiz')">Nouvelle série mélangée</button><button class="ghost" onclick="go('dash')">Voir mes progrès</button><button class="ghost" onclick="go('home')">Retour à l’accueil</button></div></section><p class="muted small">Important : ce bilan repose sur ton auto-évaluation, pas sur une correction automatique de la réponse écrite. Les erreurs sont conservées pour tes prochaines séances.</p></div>`;
}
function urgent(){
 return `<div class="page-intro"><div class="section-label">Parcours guidé</div><h2>Le temps est limité. La méthode, elle, reste claire.</h2><p class="muted">Choisis une durée réaliste. Les sessions privilégient le rappel actif et s'adaptent aux erreurs déjà enregistrées.</p></div><div class="urgent-grid">
 ${[[15,'Essentiel','Un tour rapide pour réactiver les notions majeures.','8 cartes prioritaires'],[45,'Ciblé','Une session équilibrée pour repérer et retravailler les points fragiles.','Erreurs + rappel actif'],[90,'Approfondi','Un parcours plus long qui laisse de la place au cours, aux cartes et à la simulation.','Cours + cartes + test']].map(([n,t,d,tag],i)=>`<section class="urgent-option ${i===1?'recommended':''}"><div class="urgent-option-top"><span class="urgent-index">0${i+1}</span><span class="pill">${n} MIN</span></div><h3>${t}</h3><p>${d}</p><div class="urgent-tag">${tag}</div><button onclick="startUrgent(${n})">${n===15?'Démarrer en 15 min':n===45?'Choisir le parcours ciblé':'M’engager sur 90 min'} ↗</button></section>`).join('')}
 </div><section class="urgent-note"><div class="section-label">Conseil de travail</div><p>Ne cherche pas à tout relire passivement. Réponds d’abord de mémoire, consulte la correction, puis reteste les notions difficiles un peu plus tard.</p><div class="stat"><span>Erreurs enregistrées</span><b>${progress.errors.length}</b></div><div class="stat"><span>Cartes disponibles</span><b>${DATA.cards.length}</b></div></section>`;
}
function startUrgent(n){state.urgentMinutes=n;if(n===15){state.quizList=shuffle(DATA.cards).slice(0,8);state.mode='cards';state.cardIndex=0;state.showAnswer=false;state.quizList.sort((a,b)=>(progress.known[a[0]]||0)-(progress.known[b[0]]||0));render()}else if(n===45){if(progress.errors.length)startQuiz('errors');else {state.quizList=shuffle(DATA.cards).slice(0,15);state.mode='cards';state.cardIndex=0;state.showAnswer=false;render()}}else{state.chunkIndex=0;state.mode='learn';render();}}
function errors(){
 return `<div class="page-intro"><div class="section-label">Révision ciblée</div><h2>Mes erreurs</h2><p class="muted">Un espace pour revenir sur les notions qui ont demandé un effort. Une erreur est un signal utile pour orienter la prochaine séance.</p></div><div class="error-overview"><div><div class="section-label">À reprendre</div><div class="big">${progress.errors.length}</div><p class="muted small">notion(s) enregistrée(s)</p></div><div><div class="section-label">Méthode</div><p>Lis la réponse attendue, cache-la mentalement, puis reformule-la avant de passer à la suivante.</p></div></div><section class="card error-list">
 ${progress.errors.length?progress.errors.map((e,i)=>`<article class="error-item"><div class="review-index">${String(i+1).padStart(2,'0')}</div><div class="error-content"><div class="error-topic">${esc(e.card[2])} <span>· ${e.count} erreur(s)</span></div><h3>${esc(e.card[0])}</h3><div class="answer">${esc(e.card[1])}</div></div></article>`).join(''):'<div class="empty-state"><div class="empty-mark">✓</div><h3>Rien à corriger pour le moment</h3><p class="muted">Lance un diagnostic ou un quiz : les notions à revoir apparaîtront ici.</p><button onclick="startQuiz(\'diagnostic\')">Faire le diagnostic</button></div>'}
 <div class="actions"><button onclick="startQuiz('errors')" ${!progress.errors.length?'disabled':''}>Tester mes erreurs</button><button class="secondary" onclick="state.quizList=shuffle(DATA.cards);state.cardIndex=0;state.showAnswer=false;go('cards')">Toutes les flashcards</button><button class="ghost" onclick="go('home')">Retour à l’accueil</button></div></section>`;
}
function dash(){
 let known=Object.values(progress.known).filter(n=>n>=2).length,fragile=Object.values(progress.known).filter(n=>n===1).length,topics=[...new Set(DATA.cards.map(c=>c[2]))];
 let maxTopic=Math.max(1,...topics.map(t=>DATA.cards.filter(c=>c[2]===t).length));
 return `<div class="page-intro"><div class="section-label">Tableau de bord personnel</div><h2>Les progrès se construisent séance après séance.</h2><p class="muted">Les indicateurs résument tes auto-évaluations et les thèmes présents dans les cartes.</p></div><div class="dashboard-grid"><section class="card dashboard-main"><div class="section-label">Vue d’ensemble</div><div class="dashboard-total"><div><div class="big">${progress.attempts}</div><p class="muted small">questions évaluées</p></div><div class="dashboard-mini-ring" style="--score:${(progress.attempts?progress.correct/progress.attempts*100:0)*3.6}deg"><span>${progress.attempts?Math.round(progress.correct/progress.attempts*100)+'%':'—'}</span></div></div>
 <div class="stat"><span>Réussites déclarées</span><b>${progress.correct}</b></div><div class="stat"><span>Notions consolidées (2+ rappels)</span><b>${known}</b></div><div class="stat"><span>Notions réussies une fois</span><b>${fragile}</b></div><div class="stat"><span>Erreurs à revoir</span><b>${progress.errors.length}</b></div><div class="actions"><button onclick="startQuiz('diagnostic')">Nouveau diagnostic</button><button class="secondary" onclick="exportResults()">Exporter le bilan</button></div></section>
 <section class="card coverage-card"><div class="section-label">Répartition des cartes</div><h3>Les thèmes du cours</h3>${topics.map(t=>{let n=DATA.cards.filter(c=>c[2]===t).length;return `<div class="coverage-row"><div class="coverage-label"><span>${esc(t)}</span><b>${n}</b></div><div class="bar"><span style="width:${100*n/maxTopic}%"></span></div></div>`}).join('')}<p class="muted small">Le nombre indique les cartes associées à chaque thème, pas une note ni une mesure de maîtrise.</p></section></div>
 <section class="card next-steps"><div><div class="section-label">Étape suivante</div><h3>${progress.errors.length?'Commence par tes points fragiles.':'Fais un diagnostic, puis ajuste ton effort.'}</h3><p class="muted">${progress.errors.length?'Revois les réponses enregistrées, puis reteste-les après une courte pause.':'Un premier diagnostic permet de repérer les notions à renforcer.'}</p></div><div class="actions"><button onclick="startQuiz('errors')" ${!progress.errors.length?'disabled':''}>Réviser les erreurs</button><button class="secondary" onclick="go('learn')">Reprendre le cours</button><button class="bad" onclick="resetProgress()">Réinitialiser la progression</button></div></section>`;
}
function exportResults(){let out=`BILAN DE RÉVISION — Révolution française et Empire\nQuestions traitées : ${progress.attempts}\nRéussites déclarées : ${progress.correct}\nErreurs à revoir : ${progress.errors.length}\n\nERREURS\n`+progress.errors.map(e=>`- ${e.card[0]}\n  Réponse : ${e.card[1]}\n  Partie : ${e.card[2]}`).join('\n\n');let blob=new Blob([out],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bilan_revision.txt';a.click();URL.revokeObjectURL(a.href)}
function resetProgress(){if(confirm('Effacer la progression et toutes les erreurs enregistrées ?')){progress={attempts:0,correct:0,errors:[],known:{},history:[]};save();render()}}
function render(){if(state.mode==='home')shell(home());else if(state.mode==='learn')shell(learn());else if(state.mode==='cards')shell(cardsMode());else if(state.mode==='quiz'||state.mode==='exam')shell(state.qIndex>=state.quizList.length?quizEnd():quiz());else if(state.mode==='urgent')shell(urgent());else if(state.mode==='errors')shell(errors());else if(state.mode==='dash')shell(dash());}
render();
</script></body></html>
